name: Build Windows x64

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - oss
          - local
          - dev
        default: oss
  push:
    branches:
      - 'master'
      - '*_release/*'

env:
  CARGO_TERM_COLOR: always
  CARGO_HOME: 'C:\cargo'
  RUSTFLAGS: -C debuginfo=line-tables-only

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Build Windows x64 (${{ inputs.channel || 'oss' }})
    runs-on: windows-latest-large
    timeout-minutes: 120

    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Enable git longpaths
        run: git config --system core.longpaths true

      - name: Set up rust-cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: windows
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@dc19f1e48450eefe5a29b8da6c6b00a87d730b37 # v1.18.1
        env:
          BINSTALL_VERSION: 1.14.4

      - name: Install protoc
        id: install_protoc
        uses: ConorMacBride/install-package@3e7ad059e07782ee54fa35f827df52aae0626f30 # v1
        continue-on-error: true
        with:
          choco: protoc

      - name: Install protoc via winget (fallback)
        if: ${{ steps.install_protoc.outcome == 'failure' }}
        shell: pwsh
        run: winget install Google.Protobuf

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20.9.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          & .\script\windows\install_build_deps.ps1
          & .\script\install_cargo_release_deps

      - name: Make GitHub token available
        shell: bash
        run: echo "GH_TOKEN=${{ github.token }}" >> $GITHUB_ENV

      - name: Build Warp binary
        shell: pwsh
        run: |
          $channel = '${{ inputs.channel || 'oss' }}'
          Write-Output "Building Warp for channel: $channel"

          $env:CARGO_BIN_NAME = $channel
          $env:CARGO_FULL_PROFILE = 'rlto'
          $env:WARP_APP_NAME = 'WarpOss'

          cargo build -p warp `
            --profile rlto `
            --target x86_64-pc-windows-msvc `
            --features "release_bundle,gui,nld_classifier_v1" `
            --bin "warp-oss"

          if (-Not $?) {
            Write-Error "Failed to build Warp binary"
            exit 1
          }

      - name: Prepare bundled resources
        shell: pwsh
        run: |
          $channel = '${{ inputs.channel || 'oss' }}'
          $targetDir = "target\x86_64-pc-windows-msvc\rlto\resources"

          & .\script\windows\prepare_bundled_resources.ps1 `
            -DestinationDir $targetDir `
            -Channel $channel `
            -CargoProfile "rlto"

          if (-Not $?) {
            Write-Error "Failed to prepare bundled resources"
            exit 1
          }

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          $channel = '${{ inputs.channel || 'oss' }}'
          $buildDir = "target\x86_64-pc-windows-msvc\rlto"
          $portableDir = "WarpOss-x64-portable"

          # 创建便携版目录结构
          New-Item -ItemType Directory -Force -Path "$portableDir\resources"
          New-Item -ItemType Directory -Force -Path "$portableDir\x64"
          
          # 复制二进制、资源文件和关键依赖
          Copy-Item "$buildDir\warp-oss.exe" -Destination "$portableDir\" -Force
          Copy-Item "$buildDir\resources\*" -Destination "$portableDir\resources\" -Recurse -Force
          Copy-Item "$buildDir\conpty.dll" -Destination "$portableDir\" -Force -ErrorAction SilentlyContinue
          Copy-Item "$buildDir\dxcompiler.dll" -Destination "$portableDir\" -Force -ErrorAction SilentlyContinue
          Copy-Item "$buildDir\dxil.dll" -Destination "$portableDir\" -Force -ErrorAction SilentlyContinue
          Copy-Item "$buildDir\x64\OpenConsole.exe" -Destination "$portableDir\x64\" -Force -ErrorAction SilentlyContinue

          # 压缩
          Compress-Archive -Path "$portableDir\*" -DestinationPath "${portableDir}.zip" -Force

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: warp-portable-x64-${{ inputs.channel || 'oss' }}
          path: WarpOss-x64-portable.zip
          retention-days: 30
