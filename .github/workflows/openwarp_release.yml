# OpenWarp 发布流水线 - 仅 Windows 平台
#
# 流水线结构 (先打包后发布，避免出现空 Release):
#   prepare_metadata → release_windows (上传 installer + portable 两个 artifact)
#                    → publish_release (下载 artifact 并创建 Release)

name: OpenWarp Release

# 每次 push / 手动 dispatch 时触发
on:
  push:
  workflow_dispatch:

# 创建 release + 上传 asset 需要写权限
permissions:
  contents: write
  actions: write

env:
  CARGO_TERM_COLOR: always
  CONFIG_FILE: ".github/workflows/release_configurations.json"
  CHANNEL: oss

jobs:
  prepare_metadata:
    name: Prepare metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.compute_tag.outputs.tag }}
      release_branch: ${{ steps.compute_tag.outputs.branch }}
      release_name: ${{ steps.get-config.outputs.release_base_name }} ${{ steps.compute_tag.outputs.tag }}
      release_body: ${{ steps.get-config.outputs.release_body_text }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get channel configuration
        id: get-config
        uses: ./.github/actions/get_channel_config/
        with:
          config_file: ${{ env.CONFIG_FILE }}
          channel: ${{ env.CHANNEL }}

      - name: Compute release tag and branch
        id: compute_tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            BRANCH="$TAG"
          else
            TAG="v0.$(date +%Y.%m.%d.%H%M)"
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG / build ref: $BRANCH"

  release_windows:
    name: Build Release (Windows x64)
    runs-on: windows-latest
    needs: prepare_metadata
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.prepare_metadata.outputs.release_branch }}

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          cache_key: x64
          is_self_hosted: false
          install_release_deps: true

      - name: Build binary (unsigned)
        id: build_binary
        run: script/bundle -Channel $CHANNEL -skip_build_installer --arch x64
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ needs.prepare_metadata.outputs.release_tag }}

      - name: Bundle app (unsigned installer)
        id: bundle_app
        run: script/bundle -Channel $CHANNEL -skip_build_binary --arch x64
        shell: bash
        env:
          GIT_RELEASE_TAG: ${{ needs.prepare_metadata.outputs.release_tag }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openwarp-windows-x64-installer
          path: ${{ steps.bundle_app.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Create portable package
        run: |
          # 创建便携版目录结构
          mkdir openwarp-portable
          mkdir openwarp-portable\x64
          
          # 复制主程序
          Copy-Item "${{ steps.build_binary.outputs.binary_path }}" "openwarp-portable/warp-oss.exe"
          
          # 复制必要的 DLL 文件和 OpenConsole.exe（从 app/assets/windows/x64/）
          $assets_dir = "app\assets\windows\x64"
          Copy-Item "$assets_dir\conpty.dll" "openwarp-portable/conpty.dll"
          Copy-Item "$assets_dir\dxcompiler.dll" "openwarp-portable/dxcompiler.dll"
          Copy-Item "$assets_dir\dxil.dll" "openwarp-portable/dxil.dll"
          Copy-Item "$assets_dir\OpenConsole.exe" "openwarp-portable\x64\OpenConsole.exe"
          
          # 复制 resources 目录（包含图标、字体、shell 集成等）
          $target_dir = "${{ steps.build_binary.outputs.target_profile_dir }}"
          $resources_dir = "$target_dir\resources"
          if (Test-Path "$resources_dir") {
            Copy-Item -Recurse "$resources_dir" "openwarp-portable/resources"
          } else {
            Write-Error "Resources directory not found at $resources_dir"
            exit 1
          }
          
          # 创建启动脚本
          @"
          @echo off
          cd /d "%~dp0"
          start "" "warp-oss.exe" %*
          "@ | Out-File -FilePath "openwarp-portable/start.bat" -Encoding ASCII
          
          # 创建说明文件
          @"
          OpenWarp Portable Version
          =========================
          
          Usage:
          1. Extract to any directory
          2. Double-click start.bat or run warp-oss.exe
          3. Command line args: warp-oss.exe [args]
          
          Note:
          - Portable version does not auto-update
          - Data stored in: %APPDATA%\dev.openwarp.OpenWarp
          "@ | Out-File -FilePath "openwarp-portable/README.txt" -Encoding UTF8
          
          # 打包为 ZIP
          Compress-Archive -Path "openwarp-portable/*" -DestinationPath "openwarp-windows-x64-portable.zip" -Force
        shell: pwsh

      - name: Upload portable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openwarp-windows-x64-portable
          path: openwarp-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 7

  publish_release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare_metadata
      - release_windows
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded files
        run: ls -lh dist
        shell: bash

      - name: Create GitHub release with all assets
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          name: ${{ needs.prepare_metadata.outputs.release_name }}
          tag_name: ${{ needs.prepare_metadata.outputs.release_tag }}
          body: ${{ needs.prepare_metadata.outputs.release_body }}
          draft: false
          prerelease: false
          make_latest: "true"
          files: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete workflow artifacts to free Actions storage
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id')
          for id in $ids; do
            echo "Deleting artifact $id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
        shell: bash
